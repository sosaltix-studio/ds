[package]
name = "ds"
version = "1.21.0"
edition = "2024"

[dependencies]
macroquad = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# kira не поддерживает wasm без wasm-bindgen, поэтому на вебе звук пока отключён.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
kira = { version = "0.12", default-features = false, features = ["cpal", "ogg", "vorbis"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 3
